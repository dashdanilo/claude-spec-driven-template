name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity for fixture commits
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"

      - name: Run hook and script test suites
        run: |
          set -u
          fail=0
          for f in baseline/hooks/tests/*.test.sh baseline/scripts/tests/*.test.sh; do
            echo "=== $f ==="
            if ! bash "$f"; then
              echo "--- FAILED: $f ---"
              fail=1
            fi
            echo
          done
          exit "$fail"

      - name: Run install-harness test suite
        run: bash tests/install-harness.test.sh

      - name: Check index (strict)
        run: bash baseline/scripts/check-index.sh --strict

  harness-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pinned deliberately, not `npx harness-score@latest`: the tool's own
      # semver policy allows the maturity model (what earns points) to change
      # in a minor version, so an unpinned run could regress this gate for
      # reasons that have nothing to do with a change in this repo. Bump the
      # pin by hand after reading the new version's CHANGELOG.
      #
      # --min-level 2 is the level this repo's own harness actually holds
      # today on a clean clone (verified 2026-09-23). It intentionally does
      # NOT match what a human might expect from the harness this repo
      # ships: see docs/decisions/0002-harness-visibility.md and
      # docs/guides/harness-score.md for why the Skills & Commands dimension
      # scores 0/17 regardless of how complete the harness actually is.
      - name: Run harness-score
        run: |
          set +e
          npx --yes harness-score@1.6.5 --json --md harness-score.md --min-level 2 > harness-score.json
          hs_exit=$?
          set -e
          {
            echo "## Harness Score"
            echo
            cat harness-score.md
            echo
            echo "See [docs/decisions/0002-harness-visibility.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/decisions/0002-harness-visibility.md) for why Skills & Commands undercounts this repo's harness on purpose."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$hs_exit"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-score-report
          path: |
            harness-score.json
            harness-score.md
          retention-days: 90
